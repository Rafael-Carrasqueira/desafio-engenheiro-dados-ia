apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Postgres
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: admin
    jsonData:
      database: logs
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: password
